services:
  - type: web
    name: gdg-engage
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CONVEX_URL
        value: https://canny-ferret-157.convex.cloud
      - key: PING_INTERVAL_MS
        value: "150000"
